<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Vídeos Surpresa</title>
    <style>
        :root {
            --primary: #FF0000; /* Vermelho YouTube */
            --bg: #0F0F0F;
            --text: #FFFFFF;
            --card-bg: rgba(255, 255, 255, 0.1);
            --footer-bg: rgba(0, 0, 0, 0.5);
        }

        .light-mode {
            --bg: #F8F9FA;
            --text: #212529;
            --card-bg: rgba(0, 0, 0, 0.1);
            --footer-bg: rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: all 0.3s ease;
        }

        /* Controle de Tema */
        .theme-toggle {
            position: fixed;
            top: 10px;
            right: 20px;
            padding: 12px;
            border: none;
            border-radius: 50%;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            cursor: pointer;
            z-index: 1000;
        }

        /* Player Principal */
        .hero-player {
            width: 100%;
            max-width: 1200px;
            margin: 60px auto;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        #main-player {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Botões de Categorias */
        .categories-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            padding: 20px 5%;
        }

        .category-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            background: var(--card-bg);
            backdrop-filter: blur(5px);
            color: var(--text);
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-btn:hover {
            background: var(--primary);
            transform: scale(1.05);
        }

        /* Botão Vídeo Surpresa */
        .surprise-btn {
            padding: 15px 30px;
            font-size: 22px;
            border: none;
            border-radius: 50px;
            background: var(--primary);
            color: var(--text);
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .surprise-btn:hover {
            background: #FF5733;
            transform: scale(1.05);
        }

        /* Rodapé */
        footer {
            margin-top: 50px;
            padding: 30px 5%;
            text-align: center;
            background: var(--footer-bg);
            backdrop-filter: blur(10px);
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .footer-content a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer-content .credit-icon {
            font-size: 24px;
            margin-right: 5px;
        }

        @media (max-width: 768px) {
            .hero-player {
                margin-top: 60px;
            }

            .category-btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .categories-container {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle">🌓</button>

    <h1 style="text-align: center; font-size: 36px; color: var(--primary); margin-top: 20px;">🎬 Vídeos Surpresa</h1>

    <div class="hero-player">
        <iframe id="main-player" 
                src="https://www.youtube.com/embed/?autoplay=1&mute=1" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>

    <button class="surprise-btn" onclick="loadRandomVideo()">🔄 Vídeo Surpresa</button>

    <div class="categories-container" id="categories">
        <button class="category-btn" onclick="loadCategoryVideo('Carros')">
            🚗 Carros
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Humor')">
            😂 Humor
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Política')">
            🏛 Política
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Tecnologia')">
            💻 Tecnologia
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Música')">
            🎶 Música
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Esportes')">
            ⚽ Esportes
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Culinária')">
            🍳 Culinária
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Natureza')">
            🌳 Natureza
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Educação')">
            🎓 Educação
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Viagens')">
            ✈️ Viagens
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Saúde')">
            🏥 Saúde
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Arte')">
            🎨 Arte
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Games')">
            🎮 Games
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('História')">
            📜 História
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Comédia')">
            😂 Comédia
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Animais')">
            🐾 Animais
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Cinema')">
            🎬 Cinema
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Documentário')">
            🎥 Documentário
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Notícias')">
            📰 Notícias
        </button>
        <button class="category-btn" onclick="loadCategoryVideo('Motivacional')">
            💪 Motivacional
        </button>
    </div>

    <footer>
        <div class="footer-content">
            <p><span class="credit-icon">🎥</span> Feito com ❤️ por <a href="https://www.instagram.com/joaoricardo.pe">João Ricardo</a></p>
            <p><span class="credit-icon">🌐</span> Explore mais vídeos | <span class="credit-icon">📧</span> contato@videosurpresa.com</p>
            <p><span class="credit-icon">⚡️</span> Desenvolvido com YouTube API</p>
        </div>
    </footer>

    <script>
        const API_KEY = 'AIzaSyD7Qxs7_z0ymV7u7Kj1wniGpig8mfd2CnE';
        
        // Controle de Tema
        document.querySelector('.theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
        });

        // Carregar vídeo inicial
        function loadVideo(videoId) {
            const mainPlayer = document.getElementById('main-player');
            mainPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&rel=0&enablejsapi=1`;
        }

        // Carregar vídeo por categoria
        async function loadCategoryVideo(category) {
            try {
                const response = await fetch(
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&q=${encodeURIComponent(category)}&type=video&key=${API_KEY}&videoEmbeddable=true`
                );
                if (!response.ok) throw new Error('Falha na requisição');
                
                const data = await response.json();
                const videoId = data.items[0].id.videoId;
                loadVideo(videoId);
            } catch (error) {
                console.error('Erro ao carregar vídeo:', error);
            }
        }

        // Carregar vídeo aleatório
        async function loadRandomVideo() {
            try {
                const categories = ['Carros', 'Humor', 'Política', 'Tecnologia', 'Música', 'Esportes', 'Culinária', 'Natureza', 'Educação', 'Viagens', 'Saúde', 'Arte', 'Games', 'História', 'Comédia', 'Animais', 'Cinema', 'Documentário', 'Notícias', 'Motivacional'];
                const randomCategory = categories[Math.floor(Math.random() * categories.length)];
                await loadCategoryVideo(randomCategory);
            } catch (error) {
                console.error('Erro ao carregar vídeo aleatório:', error);
            }
        }

        // Carregar vídeo inicial (pode ser de qualquer categoria)
        loadCategoryVideo('Carros');
    </script>
</body>
</html>
