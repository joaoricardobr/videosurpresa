<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Vídeos Surpresa</title>
    <style>
        :root {
            --primary: #FF0000; /* Vermelho YouTube */
            --bg: #0F0F0F;
            --text: #FFFFFF;
            --card-bg: rgba(255, 255, 255, 0.1);
            --footer-bg: rgba(0, 0, 0, 0.5);
        }

        .light-mode {
            --bg: #F8F9FA;
            --text: #212529;
            --card-bg: rgba(0, 0, 0, 0.1);
            --footer-bg: rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--text);
            text-align: center;
            transition: all 0.3s ease;
        }

        /* Título */
        h1 {
            margin: 40px 0 20px;
            font-size: 32px;
            color: var(--primary);
        }

        /* Botão Modo Claro/Escuro */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px;
            border: none;
            border-radius: 50%;
            background: var(--card-bg);
            cursor: pointer;
            z-index: 1000;
        }

        /* Player Principal */
        .hero-player {
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        #main-player {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Botão Vídeo Surpresa */
        .surprise-button {
            display: block;
            width: 250px;
            margin: 30px auto;
            padding: 18px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .surprise-button:hover {
            background-color: #cc0000;
        }

        /* Botões de Temas */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .theme-button {
            padding: 12px 20px;
            font-size: 16px;
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--primary);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-button:hover {
            background: var(--primary);
            color: white;
        }

        /* Rodapé */
        footer {
            margin-top: 50px;
            padding: 20px;
            background: var(--footer-bg);
            backdrop-filter: blur(10px);
        }

        .footer-content a {
            color: var(--primary);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }

            .surprise-button {
                width: 200px;
                font-size: 18px;
            }

            .theme-button {
                font-size: 14px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle">🌓</button>

    <h1>🎬 Vídeos Surpresa</h1>

    <div class="hero-player">
        <iframe id="main-player" 
                src="" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>

    <!-- Botão Vídeo Surpresa -->
    <button class="surprise-button" id="surprise-button">🎬 Vídeo Surpresa</button>

    <!-- Botões de Categorias -->
    <div class="button-container" id="category-buttons"></div>

    <footer>
        <div class="footer-content">
            <p>🎥 Feito com ❤️ por <a href="https://www.instagram.com/joaoricardo.pe/">Joao Ricardo</a></p>
            <p>🌐 Explore mais vídeos | 📧 contato@videosurpresa.com</p>
            <p>⚡️ Desenvolvido com YouTube API</p>
        </div>
    </footer>

    <script>
        const API_KEY = 'AIzaSyD7Qxs7_z0ymV7u7Kj1wniGpig8mfd2CnE';
        const mainPlayer = document.getElementById('main-player');
        const surpriseButton = document.getElementById('surprise-button');
        const categoryContainer = document.getElementById('category-buttons');

        // Controle de Tema
        document.querySelector('.theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
        });

        // Lista de categorias
        const categories = [
            'Humor', 'Política', 'Carros', 'Tecnologia', 'Música',
            'Esportes', 'Viagens', 'Culinária', 'Ciência', 'História',
            'Filmes', 'Games', 'Natureza', 'Animação', 'Misterioso',
            'Documentários', 'Astrologia', 'Dicas de Saúde', 'Entrevistas', 'Curiosidades'
        ];

        // Criar botões de categorias
        categories.forEach(category => {
            const button = document.createElement('button');
            button.classList.add('theme-button');
            button.innerText = category;
            button.onclick = () => loadVideo(category);
            categoryContainer.appendChild(button);
        });

        // Função para carregar vídeo de uma categoria
        async function loadVideo(query) {
            try {
                const response = await fetch(
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}&videoEmbeddable=true`
                );
                
                if (!response.ok) throw new Error('Falha na requisição');
                
                const data = await response.json();
                
                if (!data.items || data.items.length === 0) {
                    throw new Error('Nenhum vídeo encontrado');
                }

                mainPlayer.src = `https://www.youtube.com/embed/${data.items[0].id.videoId}?autoplay=1&mute=1&rel=0&enablejsapi=1`;

            } catch (error) {
                console.error('Erro ao carregar conteúdo:', error);
                alert(`Erro: ${error.message}`);
            }
        }

        // Carregar vídeo surpresa
        surpriseButton.addEventListener('click', () => {
            const randomCategory = categories[Math.floor(Math.random() * categories.length)];
            loadVideo(randomCategory);
        });

    </script>
</body>
</html>
